services:
  postgres:
    image: postgres:17
    container_name: quantext-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: quantext
      POSTGRES_USER: quantext
      POSTGRES_PASSWORD: quantext_dev_password

    ports:
      - "5432:5432"

    volumes:
      - quantext_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantext -d quantext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quantext_postgres_data: